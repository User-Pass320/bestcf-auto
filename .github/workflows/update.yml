name: Update BestCF

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bestcf-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore private template
        env:
          TEMPLATE_YAML_B64: ${{ secrets.TEMPLATE_YAML_B64 }}
        run: |
          if [ -z "$TEMPLATE_YAML_B64" ]; then
            echo "Missing GitHub secret: TEMPLATE_YAML_B64"
            exit 1
          fi
          printf '%s' "$TEMPLATE_YAML_B64" | base64 -d > template.yaml
          test -s template.yaml

      - name: Download mihomo
        run: |
          mkdir -p bin
          python - <<'PY' > mihomo_url.txt
          import json
          import re
          import urllib.request

          api = "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest"
          with urllib.request.urlopen(api, timeout=30) as response:
              release = json.load(response)
          urls = [asset["browser_download_url"] for asset in release.get("assets", [])]
          matches = [
              url for url in urls
              if re.search(r"/mihomo-linux-amd64-v[0-9][^/]*\.gz$", url)
          ]
          if not matches:
              raise SystemExit("No linux amd64 mihomo asset found in latest release")
          print(matches[0])
          PY
          curl -fsSL "$(cat mihomo_url.txt)" -o bin/mihomo.gz
          gzip -d bin/mihomo.gz
          chmod +x bin/mihomo
          ./bin/mihomo -v

      - name: Download CloudflareSpeedTest
        run: |
          mkdir -p tools/cfst
          curl -fsSL \
            -H "User-Agent: bestcf-auto-cfst" \
            https://github.com/XIU2/CloudflareSpeedTest/releases/download/v2.3.5/cfst_linux_amd64.tar.gz \
            -o tools/cfst/cfst_linux_amd64.tar.gz
          tar -zxf tools/cfst/cfst_linux_amd64.tar.gz -C tools/cfst
          chmod +x tools/cfst/cfst
          ./tools/cfst/cfst -v

      - name: Refresh external source candidates
        run: |
          mkdir -p bestcf_work/source_refresh
          rm -f bestcf_work/source_refresh/bestcf_source_candidate.txt
          set +e
          python bestcf_tool.py \
            --profile fast \
            --source-mode legacy \
            --workdir bestcf_work/source_refresh \
            --template ./template.yaml \
            --mihomo ./bin/mihomo \
            --output bestcf_work/source_refresh/bestcf_source_candidate.txt \
            --source-timeout 12 \
            --source-retries 1 \
            --source-concurrency 12 \
            --use-source-cache-quarantine \
            --geo-providers youtube,ping0 \
            --geo-concurrency 16 \
            --latency-threshold 1500 \
            --selection-mode all-regions \
            --preferred-country-min JP:20,SG:20,US:20,HK:10,KR:5,TW:5 \
            --country-max 30 \
            --country-max-overrides HK:20,DE:20 \
            --max-final-candidates 180 \
            --time-budget 240 \
            --time-safety-margin 20 \
            --allow-other-regions \
            --no-service-check \
            --no-hk-suppression
          source_exit=$?
          set -e
          if [ "$source_exit" -ne 0 ] || [ ! -s bestcf_work/source_refresh/bestcf_source_candidate.txt ]; then
            echo "External source refresh produced no usable output (exit=$source_exit); continuing with CFST."
            rm -f bestcf_work/source_refresh/bestcf_source_candidate.txt
          else
            echo "External source candidates: $(wc -l < bestcf_work/source_refresh/bestcf_source_candidate.txt)"
          fi

      - name: Run CFST candidate generation
        run: |
          mkdir -p public
          python bestcf_tool.py \
            --profile balanced \
            --source-mode cfst-only \
            --cfst-exe ./tools/cfst/cfst \
            --cfst-ip-file ./tools/cfst/ip.txt \
            --cfst-port 443 \
            --cfst-pool-limits HK:60,SG:60,UNKNOWN:0 \
            --cfst-other-pool-limit 70 \
            --workdir ./bestcf_work \
            --template ./template.yaml \
            --mihomo ./bin/mihomo \
            --output bestcf_work/bestcf_final_candidate.txt \
            --no-geo-cache \
            --no-geo-hint-cache \
            --geo-providers youtube,ping0 \
            --geo-concurrency 16 \
            --latency-threshold 1500 \
            --selection-mode all-regions \
            --country-max 35 \
            --country-max-overrides HK:15,SG:30 \
            --max-final-candidates 0 \
            --no-hk-suppression

      - name: Merge external source candidates
        run: |
          python scripts/merge-final-candidates.py \
            --primary bestcf_work/bestcf_final_candidate.txt \
            --supplement bestcf_work/source_refresh/bestcf_source_candidate.txt \
            --output bestcf_work/bestcf_final_candidate.txt \
            --summary-json bestcf_work/source_candidate_merge_summary.json

      - name: Validate generated result
        run: |
          echo "VALID_RESULT=false" >> "$GITHUB_ENV"
          if ! python scripts/verify-final-true-exit.py \
            --input bestcf_work/bestcf_final_candidate.txt \
            --output bestcf_work/bestcf_final_verified.txt \
            --workdir bestcf_work/final_true_exit_verify \
            --template ./template.yaml \
            --mihomo ./bin/mihomo \
            --providers youtube,ping0 \
            --geo-concurrency 16 \
            --actual-country-aliases VN:HK \
            --country-max 30 \
            --country-max-overrides HK:20,DE:20 \
            --max-final-candidates 0 \
            --min-lines 30 \
            --min-regions 3 \
            --details-csv bestcf_work/final_true_exit_verify.csv \
            --summary-json bestcf_work/final_true_exit_verify_summary.json \
            --region-counts-csv bestcf_work/bestcf_region_counts.csv; then
            echo "Generated candidate failed true-exit verification; keeping previous public files."
            exit 0
          fi
          if ! python bestcf_tool.py validate-output bestcf_work/bestcf_final_verified.txt --min-lines 30 --min-regions 3; then
            echo "Verified bestcf_final.txt failed validation; keeping previous public files."
            exit 0
          fi
          line_count="$(wc -l < bestcf_work/bestcf_final_verified.txt)"
          echo "Verified bestcf_final.txt lines: $line_count"
          python - <<'PY'
          import json
          from pathlib import Path
          weekly_path = Path("bestcf_work/weekly_incremental_summary.json")
          verify_path = Path("bestcf_work/final_true_exit_verify_summary.json")
          if weekly_path.exists() and verify_path.exists():
              weekly = json.loads(weekly_path.read_text(encoding="utf-8"))
              verify = json.loads(verify_path.read_text(encoding="utf-8"))
              weekly["candidate_final_count"] = weekly.pop("final_count", None)
              weekly["candidate_final_by_country"] = weekly.pop("final_by_country", {})
              weekly["verified_final_count"] = verify.get("output_count")
              weekly["verified_final_by_country"] = verify.get("output_by_actual_country", {})
              weekly["post_verify_dropped_by_cap"] = verify.get("dropped_by_post_verify_cap")
              weekly["post_verify_country_max"] = verify.get("country_max")
              weekly["post_verify_country_max_overrides"] = verify.get("country_max_overrides", {})
              weekly_path.write_text(json.dumps(weekly, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          echo "VALID_RESULT=true" >> "$GITHUB_ENV"

      - name: Copy reports
        if: env.VALID_RESULT == 'true'
        run: |
          cp bestcf_work/bestcf_final_verified.txt public/bestcf_final.txt
          cp bestcf_work/bestcf_tested.csv public/bestcf_tested.csv || true
          cp bestcf_work/bestcf_failed.csv public/bestcf_failed.csv || true
          cp bestcf_work/bestcf_sources.csv public/bestcf_sources.csv || true
          cp bestcf_work/bestcf_other_regions.csv public/bestcf_other_regions.csv || true
          cp bestcf_work/bestcf_region_counts.csv public/bestcf_region_counts.csv || true
          cp bestcf_work/bestcf_geo_provider_stats.csv public/bestcf_geo_provider_stats.csv || true
          cp bestcf_work/cfst_buckets_summary.csv public/cfst_buckets_summary.csv || true
          cp bestcf_work/cfst_colo_consistency.csv public/cfst_colo_consistency.csv || true
          cp bestcf_work/cfst_run_summary.json public/cfst_run_summary.json || true
          cp bestcf_work/edgetunnel_pool_summary.csv public/edgetunnel_pool_summary.csv || true
          cp bestcf_work/final_true_exit_verify.csv public/final_true_exit_verify.csv || true
          cp bestcf_work/final_true_exit_verify_summary.json public/final_true_exit_verify_summary.json || true
          cp bestcf_work/source_candidate_merge_summary.json public/source_candidate_merge_summary.json || true
          cp bestcf_work/source_refresh/bestcf_sources.csv public/bestcf_external_sources.csv || true
          cp bestcf_work/source_refresh/bestcf_source_prune_candidates.csv public/bestcf_external_source_prune_candidates.csv || true

      - name: Commit generated files
        if: env.VALID_RESULT == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/
          git commit -m "Update BestCF results" || echo "No changes"
          git push
